<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>圣诞树</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#02040b}canvas{display:block;width:100%;height:100%}
#word{position:fixed;left:clamp(20px,7vw,100px);top:36%;color:#fff;font:italic clamp(30px,5vw,58px)/1 Georgia,serif;letter-spacing:.045em;text-shadow:0 0 12px #d9eaff,0 0 30px #9ec9ff;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas><div id="word">圣诞树</div>
<script>
(()=>{
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d');let w,h,dpr,angle=0,tree=[],ground=[],stars=[],heart=[],snow=[];
const rand=(a,b)=>a+Math.random()*(b-a), TAU=Math.PI*2;
function make(){tree=[];ground=[];stars=[];heart=[];snow=[];
 for(let i=0;i<6800;i++){let u=Math.random(), spiral=i<4760,h=(spiral?u**1.6:Math.random()**1.9),y=12*h+.2,branch=1+.65*Math.max(0,Math.sin((h*5.8+.15)*TAU)),base=(1-h)**1.1*(spiral?3.2:4.3)*branch, a=spiral?u*9*TAU+rand(-.22,.22):rand(0,TAU),r=spiral?base*rand(.85,1.08):base*Math.sqrt(Math.random());let g=spiral?Math.min(255,155+90*Math.max(.15,1-Math.abs(h-.55)*1.5)+rand(-15,20)):rand(165,225),b=spiral?Math.min(255,225+rand(-15,35)):rand(190,250);if(Math.random()<.08&&spiral){g=rand(220,255);b=rand(230,255)}tree.push([Math.cos(a)*r,y,Math.sin(a)*r,`rgb(255,${g|0},${b|0})`,rand(1.2,2.8)])}
 const rings=[4.6,6,7.4,8.8,10.2,11.4];for(let i=0;i<950;i++){let a=rand(0,TAU),r=rand(rings[i%6]-.4,rings[i%6]+.4),c=rand(195,255)|0;ground.push([Math.cos(a)*r,-.25,Math.sin(a)*r,`rgb(${c},${c},255)`,rand(.7,1.6)])}
 for(let i=0;i<460;i++)stars.push([rand(-18,18),rand(3,18),rand(-18,18),`rgba(210,225,255,${rand(.3,.9)})`,rand(.5,1.5)]);
 let tries=0;while(heart.length<350&&tries++<12000){let x=rand(-1.3,1.3),y=rand(-1.4,1.4);if((x*x+y*y-1)**3-x*x*y**3<=0)heart.push([x*.72,12.05+(y+1)*.45,rand(-.18,.18),`rgb(255,${rand(155,225)|0},${rand(190,255)|0})`,rand(1.3,2.2)])}
 for(let i=0;i<44;i++)snow.push({x:rand(0,w),y:rand(-h,h),r:rand(1,3.5),v:rand(18,55),dr:rand(-8,8)});
}
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);make()}
function project(p){let [x,y,z,color,size]=p,ca=Math.cos(angle),sa=Math.sin(angle),xx=x*ca-z*sa,zz=x*sa+z*ca,cp=Math.cos(-.25),sp=Math.sin(-.25),yp=y*cp-zz*sp,zp=y*sp+zz*cp+13;yp-=6;if(zp<=.2)return null;let f=h*.63/zp;return [w/2+xx*f,h/2-yp*f,Math.max(.7,size*(1.5-zp*.035)),color,zp]}
let last=0;function draw(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;angle+=dt*.27;ctx.fillStyle='#02040b';ctx.fillRect(0,0,w,h);
 let glow=ctx.createRadialGradient(w*.52,h*.54,0,w*.52,h*.54,Math.max(w,h)*.58);glow.addColorStop(0,'rgba(20,37,75,.23)');glow.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);
 const list=[];for(const p of tree.concat(ground,stars,heart)){const q=project(p);if(q&&q[0]>-5&&q[0]<w+5&&q[1]>-5&&q[1]<h+5)list.push(q)}list.sort((a,b)=>b[4]-a[4]);for(const q of list){ctx.globalAlpha=.9;ctx.fillStyle=q[3];ctx.beginPath();ctx.arc(q[0],q[1],q[2],0,TAU);ctx.fill()}ctx.globalAlpha=1;
 for(const f of snow){f.y+=f.v*dt;f.x+=f.dr*dt;if(f.y>h+10){f.y=-10;f.x=rand(0,w)}if(f.x<0)f.x=w;if(f.x>w)f.x=0;ctx.fillStyle='rgba(245,250,255,.75)';ctx.shadowBlur=12;ctx.shadowColor='#dceaff';ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,TAU);ctx.fill()}ctx.shadowBlur=0;requestAnimationFrame(draw)}
addEventListener('resize',resize);resize();requestAnimationFrame(draw);
})();
</script>
</body>
</html>
